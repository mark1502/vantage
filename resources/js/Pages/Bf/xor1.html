<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary XOR Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        @import url('https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css');
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-center">Binary XOR Calculator</h1>
        
        <div class="mb-4">
            <label for="input1" class="block text-sm font-medium mb-2">First Value:</label>
            <input type="text" id="input1" placeholder="e.g., 42" 
                   class="w-full p-2 border border-gray-300 rounded focus:border-blue-500 focus:outline-none">
        </div>
        
        <div class="mb-4">
            <label for="input2" class="block text-sm font-medium mb-2">Second Value:</label>
            <input type="text" id="input2" placeholder="e.g., 15"
                   class="w-full p-2 border border-gray-300 rounded focus:border-blue-500 focus:outline-none">
        </div>
        
        <button onclick="calculateXOR()" 
                class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition-colors">
            Calculate XOR
        </button>
        
        <div id="result" class="mt-4"></div>
    </div>

    <script>
        function calculateXOR() {
            const input1 = document.getElementById('input1').value.trim();
            const input2 = document.getElementById('input2').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!input1 || !input2) {
                showError('Please enter values in both fields.');
                return;
            }
            
            try {
                let num1 = parseInt(input1, 10);
                let num2 = parseInt(input2, 10);
                
                if (Number.isNaN(num1)) {
                    throw new Error('Invalid number format in first field');
                }
                
                if (Number.isNaN(num2)) {
                    throw new Error('Invalid number format in second field');
                }
                
                if (num1 < 0 || num2 < 0) {
                    throw new Error('Please enter non-negative numbers only');
                }
                
                if (num1 > 255 || num2 > 255) {
                    throw new Error('Values must be between 0 and 255 (1 byte)');
                }
                
                const xorResult = num1 ^ num2;
                showResult(num1, num2, xorResult);
                
            } catch (error) {
                showError(error.message);
            }
        }
        
        function isBinary(str) {
            return /^[01]+$/.test(str);
        }
        
        function showResult(num1, num2, xorResult) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'p-3 bg-green-50 border-l-4 border-green-500 rounded';
            resultDiv.innerHTML = `
                <h3 class="font-bold mb-2">XOR Result:</h3>
                <div class="font-mono text-sm bg-gray-100 p-2 rounded">
                    <div><strong>Input 1:</strong> ${num1} → ${num1.toString(2).padStart(8, '0')}</div>
                    <div><strong>Input 2:</strong> ${num2} → ${num2.toString(2).padStart(8, '0')}</div>
                    <div><strong>Result:</strong> ${xorResult} → ${xorResult.toString(2).padStart(8, '0')}</div>
                </div>
            `;
        }
        
        function showError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'p-3 bg-red-50 border-l-4 border-red-500 rounded';
            resultDiv.innerHTML = `<h3 class="font-bold text-red-700">Error:</h3><p class="text-red-600">${message}</p>`;
        }
        
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateXOR();
            }
        });
    </script>
</body>
</html>
